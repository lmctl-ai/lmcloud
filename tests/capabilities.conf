# Capability matrix for tests/run-conformance.sh (design doc 13 §1).
# Format: host-name:slice=supported | pending(reason)
# host-name is derived from the host binary basename (e.g. lmaws, lmazure, lmgcp, lmoci, lmcloud-ref).
# Slices with no entry default to "supported" (scenarios must never be silently absent).
# Honesty rule (13 §1): a slice stays pending(...) until the host's adapter exists AND passes the suite.
lmaws:object-storage=supported
lmaws:queue=supported
lmaws:tables=pending(go-tables-adapter)
lmaws:function=pending(go-function-adapter;awssim-inprocess-invoke-A-FN1-A-FN2)
lmazure:object-storage=supported
lmazure:queue=supported
lmazure:tables=pending(go-tables-adapter)
lmazure:function=pending(go-function-adapter;azuresim-inprocess-invoke-AZ-FN1-AZ-FN2)
lmgcp:object-storage=supported
lmgcp:queue=supported
lmgcp:tables=pending(go-tables-adapter-gcs-grpc-cert)
lmgcp:function=pending(go-function-adapter;gcpsim-update-and-call-G-FN1-G-FN2)
lmoci:object-storage=supported
lmoci:queue=supported
lmoci:tables=pending(oci-nosql-epic)
lmoci:function=pending(go-function-adapter;ocisim-inprocess-invoke-O-FN1)
lmcloud-ref:object-storage=supported
lmcloud-ref:queue=supported
lmcloud-ref:cost-perf=supported
lmcloud-ref:tables=supported
lmcloud-ref:function=pending(go-function-adapter)
